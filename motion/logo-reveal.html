<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOSARQ — Logo Reveal</title><meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="../assets/brand.css"><link rel="stylesheet" href="../assets/logo-reveal.css">
<style>html,body{margin:0;height:100%;background:#000}#stage{width:100vw;height:100vh}
/* o azulejo.svg é resolvido a partir de /assets; aqui o caminho é ../assets */
.mq-pattern{background-image:url('../assets/azulejo.svg')}</style></head>
<body><div id="stage" class="mq-stage"></div>
<script src="../assets/vendor/gsap.min.js"></script><script src="../assets/logo-reveal.js"></script>
<script>
var tl=MosarqLogoReveal.mount(document.getElementById('stage'));
window.__tl=tl; window.__seek=function(t){tl.pause();tl.time(t);};
var m=location.search.match(/[?&]t=([\d.]+)/);if(m){window.__seek(parseFloat(m[1]));}else{tl.play();}
</script></body></html>
