/* ---------- paisagismo estilo maquete ---------- */

function tree(x,z,h,start,mat){const g=new THREE.Group();const t=new THREE.Mesh(new THREE.CylinderGeometry(.08,.14,h*.62,8),trunk);t.position.y=h*.31;g.add(t);
 for(let i=0;i<7;i++){const r=h*(.1+R()*.07);const c=new THREE.Mesh(new THREE.SphereGeometry(r,18,12),mat);c.position.set((R()-.5)*h*.32,h*(.62+R()*.28),(R()-.5)*h*.32);c.scale.y=.8;g.add(c)}

 g.traverse(o=>{if(o.isMesh){o.castShadow=true}});g.position.set(x,0,z);g.scale.setScalar(.001);s.add(g);plants.push({g,start});}
